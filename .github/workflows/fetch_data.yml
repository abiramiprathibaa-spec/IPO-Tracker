name: Generate IPO JSON

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch AI Analysis & Generate JSON
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_KEY" ]; then
            echo "Error: GEMINI_API_KEY secret is missing!"
            exit 1
          fi

          # Updated endpoint using gemini-2.5-flash
          HTTP_STATUS=$(curl -s -o gemini_raw.json -w "%{http_code}" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{
                "parts": [{"text": "Return ONLY a valid JSON array of 2 sample IPOs without markdown code blocks. Schema: [{\"company_name\":\"Name\",\"price_band\":\"₹100-110\",\"ofs_split\":\"70/30\",\"verdict\":\"BUY\"}]"}]
              }]
            }')

          echo "Gemini API HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "API request failed with status $HTTP_STATUS"
            cat gemini_raw.json
            exit 1
          fi

          # Extract and clean output
          cat gemini_raw.json | jq -r '.candidates[0].content.parts[0].text' | sed 's/```json//g' | sed 's/```//g' > data.json

      - name: Commit data.json back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Automated IPO data update" || exit 0
          git push
